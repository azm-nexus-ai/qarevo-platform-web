name: Frontend privacy regression

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: frontend-privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3101
      API_BASE_URL: http://127.0.0.1:3101
      E2E_BASE_URL: http://127.0.0.1:3100
      E2E_PRODUCTION: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install pinned dependencies
        run: npx --yes pnpm@10.28.0 install --frozen-lockfile
      - name: Run privacy regressions and production build
        run: npx --yes pnpm@10.28.0 run build
      - name: Verify the pinned browser image matches the lockfile
        run: |
          node - <<'JS'
          const assert = require('node:assert/strict')
          const { chromium } = require('@playwright/test')
          assert.equal(require('@playwright/test/package.json').version, '1.64.1', 'Update the browser image together with the Playwright lockfile version.')
          ;(async () => {
            const browser = await chromium.launch()
            console.log('PASS: pinned Chromium starts with its packaged system dependencies.')
            await browser.close()
          })().catch(error => { console.error(error.message); process.exitCode = 1 })
          JS
      - name: Repeat asynchronous submission and keyboard regressions without retries
        run: |
          npx --yes pnpm@10.28.0 exec playwright test e2e/qa-profile-chrome.spec.ts --grep "patient owned image|delayed patient settings" --repeat-each=5 --retries=0 --reporter=line
          npx --yes pnpm@10.28.0 exec playwright test e2e/batch2-patient.spec.ts --grep "intake sends fields once" --repeat-each=5 --retries=0 --reporter=line
      - name: Test browser account isolation with synthetic API fixtures
        run: npx --yes pnpm@10.28.0 run test:e2e:privacy --reporter=line
      - name: Show browser failure context
        if: failure()
        run: cat test-results/*/error-context.md
      - name: Preserve synthetic visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: synthetic-ui-evidence
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 3
